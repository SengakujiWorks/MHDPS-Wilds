server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Do not add upgrade-insecure-requests: the browser talks to loopback ws://.
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/share/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $share_backend http://share:3000;
        proxy_pass $share_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        client_max_body_size 128k;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; add_header X-MHDPS-Web "0.1.4" always; }
    location /downloads/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
}
