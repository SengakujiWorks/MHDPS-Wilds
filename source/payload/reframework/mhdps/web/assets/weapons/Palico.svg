<svg width="100%" height="100%" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Ears outline & fill -->
    <polygon points="15,10 27,24 15,26" fill="#888888" stroke="#111111" stroke-width="3.5" stroke-linejoin="miter"/>
    <polygon points="49,10 37,24 49,26" fill="#888888" stroke="#111111" stroke-width="3.5" stroke-linejoin="miter"/>
    
    <!-- Head Base -->
    <rect x="15" y="22" width="34" height="30" rx="4" fill="#ffffff" stroke="#111111" stroke-width="3.5"/>
    
    <!-- Whiskers Left -->
    <path d="M8,34 L15,34 M8,43 L15,43" stroke="#111111" stroke-width="3" stroke-linecap="square"/>
    <path d="M8,31 L8,34 M8,40 L8,43" stroke="#111111" stroke-width="3" stroke-linecap="square"/>
    
    <!-- Whiskers Right -->
    <path d="M49,34 L56,34 M49,43 L56,43" stroke="#111111" stroke-width="3" stroke-linecap="square"/>
    <path d="M56,31 L56,34 M56,40 L56,43" stroke="#111111" stroke-width="3" stroke-linecap="square"/>
    
    <!-- Eyes -->
    <circle cx="24" cy="35" r="2.8" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <circle cx="40" cy="35" r="2.8" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    
    <!-- Muzzle / Mouth (Cat muzzle shape) -->
    <path d="M26,45 C26,40 32,39 32,41 C32,39 38,40 38,45 C38,49 32,50 32,50 C32,50 26,49 26,45 Z" fill="#888888" stroke="#111111" stroke-width="2"/>
    <!-- Nose dot -->
    <circle cx="32" cy="41.5" r="1.6" fill="#111111"/>
    <!-- Mouth curve -->
    <path d="M29,46 Q32,48 32,46 Q32,48 35,46" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
</svg>
